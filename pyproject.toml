[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dot-agents-sync"
version = "0.1.0"
description = "Sync AI workflows across Codex, Claude Code, GitHub Copilot CLI, and Cursor with safe, reversible configuration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ai", "agents", "cli", "configuration", "workflows"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
]
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5", "packaging>=24,<27", "platformdirs>=4.3,<5", "prompt-toolkit>=3.0.50,<4"]

[project.urls]
Homepage = "https://github.com/Shreyasdbz/dot-agents-sync"
Documentation = "https://github.com/Shreyasdbz/dot-agents-sync/blob/main/docs/README.md"
Repository = "https://github.com/Shreyasdbz/dot-agents-sync"
Issues = "https://github.com/Shreyasdbz/dot-agents-sync/issues"
Changelog = "https://github.com/Shreyasdbz/dot-agents-sync/releases"

[project.scripts]
dasync = "dasync.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "hypothesis>=6.120,<7", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["cli/dasync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["cli"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
