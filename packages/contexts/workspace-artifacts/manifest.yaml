{
  "apiVersion": "dasync.dev/v1",
  "kind": "Context",
  "id": "context.workspace-artifacts",
  "name": "workspace-artifacts",
  "version": "1.1.1",
  "description": "Private workspace branding, offline assets and visual verification for HTML artifacts.",
