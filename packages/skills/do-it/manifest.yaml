{
  "apiVersion": "dasync.dev/v1",
  "kind": "Skill",
  "id": "skill.do-it",
  "name": "do-it",
  "version": "1.3.0",
  "description": "Implement an authorized task or bounded change, verify observable behavior, and report remaining work without expanding scope.",
  "presentation": {
    "display_name": "Do It",
    "short_description": "Implement and verify an authorized bounded change",
    "default_prompt": "Use $dasync-skill-do-it to implement and verify this authorized bounded change."
  },
  "license": "MIT",
  "entry": "SKILL.md",
  "files": [
    "SKILL.md",
    "stateful-changes.md"
  ],
  "scopes": [
    "user",
    "project"
  ],
  "token_budget": 1500,
  "requires": {
    "policy.repository-guidance": ">=1,<2",
    "policy.scope": ">=1,<2",
    "policy.coding": ">=1,<2",
    "policy.verification": ">=1,<2",
    "policy.git": ">=1,<2",
    "policy.communication": ">=1,<2"
  },
  "capabilities": [
    "filesystem.read"
  ],
  "prefers": [
    "tests.execute"
  ],
  "fallback": "Implement only within available authority; label checks that could not execute instead of claiming verification.",
  "outputs": [
    "inline"
  ],
  "suggests": []
}
