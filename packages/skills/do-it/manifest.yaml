{
  "apiVersion": "dasync.dev/v1",
  "kind": "Skill",
  "id": "skill.do-it",
  "name": "do-it",
  "version": "1.1.0",
  "description": "Implement an authorized task or bounded change, verify observable behavior, and report remaining work without expanding scope.",
  "license": "UNLICENSED",
  "entry": "SKILL.md",
  "files": [
    "SKILL.md"
  ],
  "scopes": [
    "user",
    "project"
  ],
  "token_budget": 1500,
  "requires": {
    "policy.scope": ">=1,<2",
    "policy.coding": ">=1,<2",
    "policy.verification": ">=1,<2",
    "policy.git": ">=1,<2"
  },
  "capabilities": [
    "filesystem.read"
  ],
  "prefers": [
    "tests.execute"
  ],
  "fallback": "Implement only within available authority; label checks that could not execute instead of claiming verification.",
  "outputs": [
    "inline"
  ],
  "suggests": []
}
