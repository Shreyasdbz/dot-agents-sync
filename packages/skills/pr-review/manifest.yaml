{
  "apiVersion": "dasync.dev/v1",
  "kind": "Skill",
  "id": "skill.pr-review",
  "name": "pr-review",
  "version": "1.1.0",
  "description": "Review a PR or supplied diff for actionable regressions and requirement gaps, inline by default; optionally post or create reports.",
  "license": "UNLICENSED",
  "entry": "SKILL.md",
  "files": [
    "SKILL.md"
  ],
  "scopes": [
    "user",
    "project"
  ],
  "token_budget": 1500,
  "requires": {
    "template.pr-review": ">=1,<2",
    "policy.scope": ">=1,<2",
    "policy.verification": ">=1,<2"
  },
  "capabilities": [
    "filesystem.read"
  ],
  "prefers": [
    "github.review"
  ],
  "fallback": "Review the supplied diff snapshot inline; no claim of current PR state or posting.",
  "outputs": [
    "inline",
    "markdown",
    "html",
    "pr-review"
  ],
  "suggests": []
}
