{
  "apiVersion": "dasync.dev/v1",
  "kind": "Skill",
  "id": "skill.pr-review",
  "name": "pr-review",
  "version": "1.8.0",
  "description": "Review pinned PRs through surrounding code, isolated baseline comparisons and bounded reviewers; return actionable findings inline with optional reports or posting.",
  "presentation": {
    "display_name": "PR Review",
    "short_description": "Trace PR behavior and validate actionable findings",
    "default_prompt": "Use $dasync-skill-pr-review to walk through this PR and its affected contracts, validate findings with bounded reviewers, and report the evidence."
  },
  "license": "MIT",
  "entry": "SKILL.md",
  "files": [
    "SKILL.md",
    "references/revisions.md",
    "references/walkthrough.md",
    "references/reviewers.md"
  ],
  "scopes": [
    "user",
    "project"
  ],
  "token_budget": 5200,
  "requires": {
    "context.artifact-routing": ">=1,<2",
    "policy.repository-guidance": ">=1,<2",
    "template.pr-review": ">=1,<2",
    "policy.scope": ">=1,<2",
    "policy.verification": ">=1,<2",
    "policy.communication": ">=1,<2",
    "skill.visual-artifacts": ">=1,<2",
    "policy.coding": ">=1,<2",
    "policy.git": ">=1,<2",
    "policy.security": ">=1,<2",
    "policy.engineering-effectiveness": ">=1,<2"
  },
  "capabilities": [
    "filesystem.read"
  ],
  "prefers": [
    "github.review",
    "agents.parallel",
    "tests.execute"
  ],
  "fallback": "Review pinned evidence inline; name unavailable freshness, independent review, execution or posting without claiming success.",
  "outputs": [
    "inline",
    "markdown",
    "html",
    "pr-review"
  ],
  "suggests": []
}
