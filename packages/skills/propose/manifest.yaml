{
  "apiVersion": "dasync.dev/v1",
  "kind": "Skill",
  "id": "skill.propose",
  "name": "propose",
  "version": "1.2.0",
  "description": "Design a change: clarify consequential requirements, compare viable approaches, and write a proposal. Not implementation planning.",
  "presentation": {
    "display_name": "Propose",
    "short_description": "Compare approaches and write a supported proposal",
    "default_prompt": "Use $dasync-skill-propose to compare viable approaches and write a supported proposal for this change."
  },
  "license": "UNLICENSED",
  "entry": "SKILL.md",
  "files": [
    "SKILL.md"
  ],
  "scopes": [
    "user",
    "project"
  ],
  "token_budget": 1500,
  "requires": {
    "template.design-proposal": ">=1,<2",
    "policy.scope": ">=1,<2",
    "policy.research": ">=1,<2",
    "policy.communication": ">=1,<2"
  },
  "capabilities": [
    "filesystem.read"
  ],
  "prefers": [
    "agents.parallel",
    "web.search"
  ],
  "fallback": "Use available evidence and a self-check; identify unverified external guarantees and unavailable independent review.",
  "outputs": [
    "markdown",
    "html"
  ],
  "suggests": []
}
