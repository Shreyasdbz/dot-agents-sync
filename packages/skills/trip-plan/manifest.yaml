{
  "apiVersion": "dasync.dev/v1",
  "kind": "Skill",
  "id": "skill.trip-plan",
  "name": "trip-plan",
  "version": "1.2.0",
  "description": "Compatibility entrypoint for Travel Planner. Use the travel-planner agent for itinerary planning; this alias preserves existing selections.",
  "presentation": {
    "display_name": "Trip Plan",
    "short_description": "Route itinerary planning to the Travel Planner",
    "default_prompt": "Use $dasync-skill-trip-plan to plan this itinerary through the Travel Planner workflow."
  },
  "license": "UNLICENSED",
  "entry": "SKILL.md",
  "files": [
    "SKILL.md"
  ],
  "scopes": [
    "user",
    "project"
  ],
  "token_budget": 1500,
  "requires": {
    "template.trip-plan": ">=1,<2",
    "policy.research": ">=1,<2",
    "policy.communication": ">=1,<2",
    "agent.travel-planner": ">=1,<2"
  },
  "capabilities": [
    "filesystem.read"
  ],
  "prefers": [
    "web.search"
  ],
  "fallback": "Return a provisional itinerary from supplied facts; prices, schedules and availability remain unverified.",
  "outputs": [
    "markdown"
  ],
  "suggests": []
}
