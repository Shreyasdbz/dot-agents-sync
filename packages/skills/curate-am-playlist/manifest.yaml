{
  "apiVersion": "dasync.dev/v1",
  "kind": "Skill",
  "id": "skill.curate-am-playlist",
  "name": "curate-am-playlist",
  "version": "1.2.0",
  "description": "Curate an intentionally sequenced Apple Music playlist from listening goals; account changes require explicit authorization.",
  "presentation": {
    "display_name": "Curate AM Playlist",
    "short_description": "Build intentionally sequenced Apple Music playlists",
    "default_prompt": "Use $dasync-skill-curate-am-playlist to build an intentionally sequenced Apple Music playlist for this listening goal."
  },
  "license": "UNLICENSED",
  "entry": "SKILL.md",
  "files": [
    "SKILL.md"
  ],
  "scopes": [
    "user",
    "project"
  ],
  "token_budget": 1500,
  "requires": {
    "template.playlist": ">=1,<2",
    "policy.scope": ">=1,<2",
    "policy.communication": ">=1,<2"
  },
  "capabilities": [
    "filesystem.read"
  ],
  "prefers": [
    "music.search",
    "music.playlist"
  ],
