{
  "apiVersion": "dasync.dev/v1",
  "kind": "Skill",
  "id": "skill.visual-artifacts",
  "name": "visual-artifacts",
  "version": "1.2.0",
  "description": "Create visual explanations, diagrams and interactive HTML artifacts; improve composition and motion in requested decks, reports and interfaces. Keep simple answers inline.",
  "presentation": {
    "display_name": "Visual Artifacts",
    "short_description": "Compose visual explanations and interactive HTML",
    "default_prompt": "Use $dasync-skill-visual-artifacts to explain this visually with a focused, source-grounded view."
  },
  "license": "MIT",
  "entry": "SKILL.md",
  "files": [
    "SKILL.md",
    "composition.md",
    "diagrams.md",
    "motion.md"
  ],
  "scopes": [
    "user",
    "project"
  ],
  "token_budget": 5200,
  "requires": {
    "context.artifact-routing": ">=1,<2",
    "policy.accessibility": ">=1,<2",
    "policy.communication": ">=1,<2"
  },
  "capabilities": [
    "filesystem.read"
  ],
  "prefers": [
    "browser.render"
  ],
  "fallback": "Create a readable static explanation; report unavailable rendering, interaction and motion verification.",
  "outputs": [
    "inline",
    "html"
  ],
  "suggests": [
    "context.workspace-artifacts"
  ]
}
