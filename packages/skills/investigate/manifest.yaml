{
  "apiVersion": "dasync.dev/v1",
  "kind": "Skill",
  "id": "skill.investigate",
  "name": "investigate",
  "version": "1.2.0",
  "description": "Explain a failure or answer a research question with traceable evidence, inline by default. Diagnosis does not authorize a fix.",
  "presentation": {
    "display_name": "Investigate",
    "short_description": "Investigate failures with traceable evidence",
    "default_prompt": "Use $dasync-skill-investigate to investigate this failure and return a traceable diagnosis."
  },
  "license": "UNLICENSED",
  "entry": "SKILL.md",
  "files": [
    "SKILL.md"
  ],
  "scopes": [
    "user",
    "project"
  ],
  "token_budget": 1500,
  "requires": {
    "template.investigation": ">=1,<2",
    "policy.research": ">=1,<2",
    "policy.communication": ">=1,<2"
  },
  "capabilities": [
    "filesystem.read"
  ],
  "prefers": [
    "web.search"
  ],
  "fallback": "Analyze supplied evidence; disclose which current external facts could not be verified.",
  "outputs": [
    "inline",
    "markdown"
  ],
  "suggests": [
    "skill.pitch-deck"
  ]
}
