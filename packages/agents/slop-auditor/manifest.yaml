{
  "apiVersion": "dasync.dev/v1",
  "kind": "Agent",
  "id": "agent.slop-auditor",
  "name": "slop-auditor",
  "version": "1.3.0",
  "description": "Find unsupported completion claims, unfinished production paths, and filler without misclassifying test doubles or reusable templates.",
  "license": "MIT",
  "entry": "AGENT.md",
  "files": [
    "AGENT.md"
  ],
  "scopes": [
    "user",
    "project"
  ],
  "token_budget": 650,
  "outputs": [
    "findings",
    "evidence",
    "verification-limits"
  ],
  "requires": {
    "policy.repository-guidance": ">=1,<2",
    "policy.communication": ">=1,<2"
  }
}
