<figure class="data-flow"><figcaption><strong>Payment request and recovery path</strong></figcaption><ol class="flow-nodes"><li><strong>API</strong><code>operation_id</code><span class="edge-label">validates and writes →</span></li><li><strong>Postgres</strong><code>pending operation</code><span class="edge-label">claimed by →</span></li><li><strong>Worker</strong><code>original key + payload</code><span class="edge-label">request across trust boundary →</span></li><li><strong>Payment provider</strong><code>result or unknown</code></li></ol><p class="small">The worker records the provider result in Postgres. Unknown outcomes return to reconciliation; they do not create a new payment identity.</p></figure>
