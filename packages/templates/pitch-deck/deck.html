<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentation</title>
<style>
:root{color-scheme:light dark;--bg:#f7f6f2;--ink:#202724;--accent:#22634d;--line:#bac4bd;font:18px/1.5 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:1200px;margin:auto;padding:clamp(1rem,4vw,4rem)}
section{min-height:75vh;padding:2rem 0;scroll-margin-top:2rem}h1,h2{font-size:clamp(1.8rem,4vw,3.5rem);line-height:1.12;max-width:24ch;letter-spacing:-.025em}p{max-width:65ch}
nav{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:1rem;background:var(--bg);border-top:1px solid var(--line)}button,a{font:inherit;color:inherit}button{padding:.5rem .9rem;background:transparent;border:1px solid var(--line);border-radius:.3rem;cursor:pointer}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}progress{accent-color:var(--accent);max-width:8rem}.skip{position:absolute;top:-10rem}.skip:focus{top:1rem}
@media(prefers-color-scheme:dark){:root{--bg:#18211d;--ink:#ecf0ec;--accent:#a0dbc0;--line:#60746a}}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
@media print{nav,.skip{display:none}section{break-after:page;min-height:0}body{background:white;color:black}main{padding:0}a{color:inherit}}
</style>
<a class="skip" href="#slides">Skip navigation</a>
<main id="slides" tabindex="-1">
<!-- Author complete semantic sections here. Each section needs an id and an assertion-style h1/h2. Keep all sections readable with JavaScript disabled. -->
</main>
<nav aria-label="Presentation controls">
<button id="prev" type="button">Previous</button><button id="next" type="button">Next</button>
<label for="sections">Section</label><select id="sections"></select>
<span id="status" role="status" aria-live="polite"></span><progress id="progress" aria-label="Presentation progress"></progress>
</nav>
<script>
(()=>{'use strict';const slides=[...document.querySelectorAll('main>section')],prev=document.querySelector('#prev'),next=document.querySelector('#next'),select=document.querySelector('#sections'),status=document.querySelector('#status'),progress=document.querySelector('#progress');let index=0;
slides.forEach((slide,i)=>{slide.id||=`slide-${i+1}`;const option=document.createElement('option');option.value=String(i);option.textContent=slide.querySelector('h1,h2')?.textContent||`Section ${i+1}`;select.append(option)});
function state(){prev.disabled=index===0;next.disabled=index>=slides.length-1;select.value=String(index);status.textContent=slides.length?`${index+1} of ${slides.length}`:'No slides';progress.max=Math.max(1,slides.length);progress.value=slides.length?index+1:0}
function go(i){index=Math.max(0,Math.min(slides.length-1,i));slides[index]?.scrollIntoView({block:'start'});state()}
prev.onclick=()=>go(index-1);next.onclick=()=>go(index+1);select.onchange=()=>go(Number(select.value));document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,button,a,[contenteditable]'))return;if(['ArrowRight','ArrowDown','PageDown'].includes(e.key)){e.preventDefault();go(index+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1)});
const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(visible){index=slides.indexOf(visible.target);state()}},{threshold:[.25,.5,.75]});slides.forEach(s=>observer.observe(s));state();})();
</script>
</html>
